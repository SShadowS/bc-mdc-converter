name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: bc-mdc-converter-linux-x64
            binary: bc-mdc-converter
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: bc-mdc-converter-linux-arm64
            binary: bc-mdc-converter
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bc-mdc-converter-windows-x64.exe
            binary: bc-mdc-converter.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: bc-mdc-converter-windows-arm64.exe
            binary: bc-mdc-converter.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bc-mdc-converter-macos-arm64
            binary: bc-mdc-converter
          # Intel macOS runners are retired; cross-compile from Apple Silicon.
          # Tests are skipped for this target (build-only).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bc-mdc-converter-macos-x64
            binary: bc-mdc-converter
            skip-tests: true
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Ensure Rust toolchain
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.skip-tests != true
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
